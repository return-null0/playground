<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:;"
/>


    <title>Camera Mode</title>
<link rel="stylesheet" href="styles/styles1.css">
  </head>

  <body>
<header>
  <button id="backBtn" class="glass-btn">← Back</button>
  
  <h1>Camera · Vision Mode</h1>

  <label class="glass-btn toggle-container">
    <span>Person</span>
    <input type="checkbox" id="togglePerson" checked>
    <div class="toggle-slider"></div>
  </label>
</header>


    <main>
      <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>

<!-- Raw frame buffer (AI input) -->
<canvas id="rawCanvas"></canvas>

<!-- What the user actually sees -->
<canvas id="previewCanvas"></canvas>
        <div class="overlay"></div>
      </div>
    </main>

    <footer>
      Live camera feed
    </footer>
    
    <script src="../scripts/camera.js"></script>
  </body>
</html>
